<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="400" height="400">
  <defs>
    <radialGradient id="bg1" cx="30%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#5eecd4" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#5eecd4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bg2" cx="70%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#5eecd4" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#5eecd4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- outer ring (mint glow) -->
  <circle cx="100" cy="100" r="98" fill="none" stroke="#5eecd4" stroke-opacity="0.18" stroke-width="1"/>

  <!-- main circle -->
  <circle cx="100" cy="100" r="90" fill="#14202c" stroke="rgba(255,255,255,0.14)" stroke-width="1"/>

  <!-- gradient highlights -->
  <circle cx="100" cy="100" r="90" fill="url(#bg1)"/>
  <circle cx="100" cy="100" r="90" fill="url(#bg2)"/>

  <!-- person silhouette icon -->
  <g transform="translate(100, 100)" stroke="rgba(255,255,255,0.55)" stroke-width="3.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- head -->
    <circle cx="0" cy="-12" r="14"/>
    <!-- shoulders -->
    <path d="M -22 28 C -22 12 -10 5 0 5 C 10 5 22 12 22 28"/>
  </g>
</svg>
